<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Практическая работа: Python</title>
    
    <!-- Pyodide (Основной Python) -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"></script>

    <style>
        :root {
            --primary: #4f46e5;
            --success: #22c55e;
            --error: #ef4444;
            --hard: #f59e0b;
            --glass: rgba(255, 255, 255, 0.92);
        }
		/* Запрет выделения текста на странице */
body {
    -webkit-user-select: none; /* Chrome, Safari, Opera */
    -moz-user-select: none;    /* Firefox */
    -ms-user-select: none;     /* Internet Explorer/Edge */
    user-select: none;         /* Стандартный синтаксис */
}

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: #334155;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container { max-width: 900px; margin: 0 auto; }

        header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }
        
        header h1 { font-size: 2.2em; margin-bottom: 5px; color: white; }
        header p { opacity: 0.9; font-weight: 600; font-size:1.6em;color: blue; }

        #loader {
            text-align: center;
            padding: 15px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 8px;
            margin-bottom: 20px;
            color: var(--primary);
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            backdrop-filter: blur(5px);
        }
        #loader.ready {
            background: rgba(34, 197, 94, 0.9);
            color: white;
        }

        .student-info-panel {
            background: var(--glass);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            margin-bottom: 25px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.5);
        }
        
        @media (max-width: 600px) {
            .student-info-panel { grid-template-columns: 1fr; }
        }

        .input-group { display: flex; flex-direction: column; }
        .input-group label { font-size: 0.9em; margin-bottom: 5px; font-weight: 600; color: #475569; }
        .input-group input {
            padding: 10px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        .input-group input:focus { border-color: var(--primary); outline: none; }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            justify-content: center;
        }

        .tab-btn {
            padding: 10px 20px;
            border: 2px solid rgba(255,255,255,0.5);
            background: rgba(255,255,255,0.3);
            color: white;
            cursor: pointer;
            border-radius: 12px;
            font-weight: bold;
            font-size: 1em;
            transition: all 0.3s;
            backdrop-filter: blur(5px);
        }

        .tab-btn:hover { background: rgba(255,255,255,0.5); transform: translateY(-2px); }
        .tab-btn.active { 
            background: white;
            color: var(--primary);
            border-color: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .task-card {
            background: var(--glass);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            position: relative;
            border: 1px solid rgba(255,255,255,0.6);
            backdrop-filter: blur(8px);
            transition: transform 0.2s;
        }
        
        .task-card:hover { transform: translateY(-3px); }

        .task-passed-indicator {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 28px;
        }

        .task-desc {
            background: #f8fafc;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 5px solid var(--primary);
            -webkit-user-select: none; 
            user-select: none;         
        }

        .task-hard .task-desc {
            background: #fffbeb;
            border-left-color: var(--hard);
        }
        .task-hard h2 { color: var(--hard); }

        .editor-area { margin-bottom: 15px; }

        /* Стили для обычного textarea (если CodeMirror не загрузится) */
        textarea {
            width: 100%;
            height: 150px;
            background: #1e293b;
            color: #e2e8f0;
            border: none;
            border-radius: 8px;
            padding: 15px;
            font-family: 'Consolas', monospace;
            font-size: 14px;
            resize: vertical;
            box-sizing: border-box;
            outline: none;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.2);
        }

        /* Стили CodeMirror */
        .CodeMirror {
            height: 150px;
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Consolas', monospace;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.2);
        }
        
        .btn-run {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            box-shadow: 0 4px 6px rgba(79, 70, 229, 0.3);
        }
        .btn-run:hover { background: #4338ca; transform: translateY(-1px); }
        .btn-run:disabled { background: #94a3b8; cursor: not-allowed; transform: none; box-shadow: none; }

        .finish-section {
            text-align: center;
            margin-top: 40px;
            margin-bottom: 60px;
        }
        .btn-finish {
            background: white;
            color: var(--primary);
            border: none;
            padding: 15px 50px;
            border-radius: 50px;
            font-size: 18px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            transition: all 0.3s;
        }
        .btn-finish:hover { transform: scale(1.05); box-shadow: 0 15px 30px rgba(0,0,0,0.3); }

        .results-grid { margin-top: 20px; display: grid; gap: 10px; }

        .test-case {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            padding: 12px;
            font-family: monospace;
            font-size: 13px;
        }
        .test-case.success { border-left: 5px solid var(--success); background: #f0fdf4; }
        .test-case.fail { border-left: 5px solid var(--error); background: #fef2f2; }

        .test-header { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 5px; }
        .label { color: #64748b; font-size: 12px; margin-right: 5px; }
        .data { color: #1e293b; }
        .status-ok { color: var(--success); }
        .status-fail { color: var(--error); }

        /* === МОДАЛЬНОЕ ОКНО === */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }
        
        .modal-open { opacity: 1; visibility: visible; }

        .modal-card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            max-width: 450px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            transform: scale(0.8);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
            position: relative;
        }
        
        .modal-open .modal-card { transform: scale(1); }

        .modal-bg-circle {
            position: absolute;
            top: -50px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%);
            z-index: 0;
            opacity: 0.2;
        }

        .modal-content { position: relative; z-index: 1; }

        .modal-grade-container {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 64px;
            font-weight: 900;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.4); }
            70% { box-shadow: 0 0 0 20px rgba(255, 255, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); }
        }

        .grade-style-5 { background: linear-gradient(135deg, #FFD700, #FFA500); color: #fff; }
        .grade-style-4 { background: linear-gradient(135deg, #00C6FF, #0072FF); color: #fff; }
        .grade-style-3 { background: linear-gradient(135deg, #F09819, #EDDE5D); color: #fff; }
        .grade-style-2 { background: linear-gradient(135deg, #CB2D3E, #EF473A); color: #fff; }

        .modal-emoji { font-size: 40px; margin-bottom: 10px; display: block; }
        .modal-title { font-size: 24px; color: #1e293b; margin-bottom: 5px; font-weight: 800; }
        .modal-subtitle { color: #64748b; margin-bottom: 20px; }

        .modal-stats-box {
            background: #f8fafc;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: left;
        }
        
        .modal-stats-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .btn-close-modal {
            background: #334155;
            color: white;
            border: none;
            padding: 10px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: background 0.2s;
        }
        .btn-close-modal:hover { background: #1e293b; }
/* --- Кнопка "На главную" --- */
.back-btn {
    position: fixed; /* Фиксированная позиция */
    top: 20px;
    left: 20px;
    z-index: 9999; /* Поверх всех элементов */
    
    /* Стеклянный стиль */
    background: rgba(255, 255, 255, 0.7);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.5);
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    
    /* Оформление текста */
    text-decoration: none;
    color: var(--primary);
    font-weight: bold;
    font-size: 16px;
    padding: 10px 20px;
    border-radius: 30px;
    transition: all 0.3s;
    display: flex;
    align-items: center;
    gap: 8px;
}
 /* Дополнительный класс для выделения класса */
        .grade-badge {
            background: rgba(255,255,255,0.2);
            padding: 5px 15px;
            border-radius: 10px;
            font-size: 1.2em;
            margin-bottom: 5px;
            display: inline-block;
            border: 1px solid rgba(255,255,255,0.4);
    </style>
</head>
<body>
<!-- Кнопка возврата на главную -->
<a href="index.html" class="back-btn">
    <span>&larr;</span> На главную
</a>
<div class="container">
    <header>
	 <div class="grade-badge">Информатика • 8 класс</div>
        <h1>Основы Python.Практическая работа.</h1>
        <p>Основы программирования Python. Ввод, вывод данных.</p>
    </header>

    <div id="loader">⏳ Инициализация Python среды...</div>

    <div class="student-info-panel">
        <div class="input-group">
            <label for="student-name">Фамилия Имя:</label>
            <input type="text" id="student-name" placeholder="Фамилия Имя">
        </div>
        <div class="input-group">
            <label for="student-class">Класс:</label>
            <input type="text" id="student-class" placeholder="Класс">
        </div>
    </div>

    <div class="tabs" id="tabs-container"></div>
    <div id="tasks-container"></div>

    <div class="finish-section">
        <button class="btn-finish" onclick="finishWork()">Завершить работу</button>
    </div>
</div>

<!-- Модальное окно -->
<div id="result-modal" class="modal-overlay" onclick="closeModal(event)">
    <div class="modal-card" onclick="event.stopPropagation()">
        <div class="modal-bg-circle"></div>
        <div class="modal-content">
            <span id="modal-emoji" class="modal-emoji">🏆</span>
            <div id="modal-grade-circle" class="modal-grade-container grade-style-5">5</div>
            <div id="modal-title" class="modal-title">Отлично!</div>
            <div id="modal-subtitle" class="modal-subtitle">Работа выполнена успешно</div>
            
            <div class="modal-stats-box">
                <div class="modal-stats-row">
                    <span>Ученик:</span>
                    <span id="res-name">-</span>
                </div>
                <div class="modal-stats-row">
                    <span>Класс:</span>
                    <span id="res-class">-</span>
                </div>
                <div class="modal-stats-row">
                    <span>Вариант:</span>
                    <span id="res-variant">-</span>
                </div>
                <div class="modal-stats-row">
                    <span>Решено задач:</span>
                    <span id="res-solved">0 из 5</span>
                </div>
            </div>
            
            <button class="btn-close-modal" onclick="closeModalAndReset()">Закрыть</button>
        </div>
    </div>
</div>

<!-- Подключаем CodeMirror в конце тела страницы, чтобы не тормозить загрузку -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/monokai.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/python/python.min.js"></script>

<script>
// Запрет контекстного меню (правая кнопка мыши)
document.addEventListener('contextmenu', event => event.preventDefault());
    let pyodide = null;
    let currentVariant = 1;
    let taskStatus = {};
    let codeEditors = {}; // Хранилище редакторов CodeMirror

       const VARIANTS = {
        1: [
            {
                id: "v1t1",
                title: "Задача 1. Приветствие",
                desc: "Напишите программу, которая запрашивает имя пользователя и выводит 'Привет, [Имя]!'.",
                tests: [
                    { input: "Иван", expected: "Привет, Иван!" },
                    { input: "Maria", expected: "Привет, Maria!" },
                    { input: "Python", expected: "Привет, Python!" }
                ]
            },
            {
                id: "v1t2",
                title: "Задача 2. Сумма двух чисел",
                desc: "Напишите программу, которая запрашивает два целых числа и выводит их сумму. Числа вводятся каждое с новой строки.",
                tests: [
                    { input: "5\n3", expected: "8" },
                    { input: "10\n-2", expected: "8" },
                    { input: "0\n0", expected: "0" }
                ]
            },
            {
                id: "v1t3",
                title: "Задача 3. Стоимость покупки",
                desc: "Запросите цену товара (float) и количество (int). Выведите общую стоимость.",
                tests: [
                    { input: "10.5\n2", expected: "21.0" },
                    { input: "5.0\n4", expected: "20.0" },
                    { input: "100\n1", expected: "100.0" }
                ]
            },
            {
                id: "v1t4",
                title: "Задача 4. Площадь прямоугольника",
                desc: "Запросите длину и ширину прямоугольника (float). Выведите площадь.",
                tests: [
                    { input: "5.0\n2.0", expected: "10.0" },
                    { input: "3\n4", expected: "12.0" },
                    { input: "2.5\n2.5", expected: "6.25" }
                ]
            },
            {
                id: "v1t5",
                isHard: true,
                title: "Задача 5. Перевод времени (Повышенная сложность)",
                desc: "Пользователь вводит количество минут (целое число). Программа должна перевести это значение в часы и минуты. Выведите два числа: количество полных часов и оставшихся минут через пробел. (Пример: 125 минут -> 2 часа 5 минут. Вывод: '2 5').",
                tests: [
                    { input: "125", expected: "2 5" },
                    { input: "60", expected: "1 0" },
                    { input: "59", expected: "0 59" }
                ]
            }
        ],
        2: [
            {
                id: "v2t1",
                title: "Задача 1. Любимое блюдо",
                desc: "Спросите любимое блюдо. Выведите 'Я тоже люблю [Блюдо]!'",
                tests: [
                    { input: "Пицца", expected: "Я тоже люблю Пицца!" },
                    { input: "Суши", expected: "Я тоже люблю Суши!" },
                    { input: "Борщ", expected: "Я тоже люблю Борщ!" }
                ]
            },
            {
                id: "v2t2",
                title: "Задача 2. Разность чисел",
                desc: "Запросите два целых числа. Выведите результат вычитания второго из первого.",
                tests: [
                    { input: "10\n4", expected: "6" },
                    { input: "5\n5", expected: "0" },
                    { input: "3\n10", expected: "-7" }
                ]
            },
            {
                id: "v2t3",
                title: "Задача 3. Среднее арифметическое",
                desc: "Запросите три числа (float). Выведите их среднее арифметическое.",
                tests: [
                    { input: "2\n4\n6", expected: "4.0" },
                    { input: "1\n2\n3", expected: "2.0" },
                    { input: "10\n20\n30", expected: "20.0" }
                ]
            },
            {
                id: "v2t4",
                title: "Задача 4. Периметр квадрата",
                desc: "Запросите сторону квадрата (int). Выведите периметр.",
                tests: [
                    { input: "5", expected: "20" },
                    { input: "1", expected: "4" },
                    { input: "10", expected: "40" }
                ]
            },
            {
                id: "v2t5",
                isHard: true,
                title: "Задача 5. Калькулятор скидки (Повышенная сложность)",
                desc: "Запросите цену товара (float) и размер скидки в процентах (int). Выведите новую цену товара с учетом скидки.",
                tests: [
                    { input: "100.0\n10", expected: "90.0" },
                    { input: "200.0\n50", expected: "100.0" },
                    { input: "50.0\n0", expected: "50.0" }
                ]
            }
        ],
        3: [
            {
                id: "v3t1",
                title: "Задача 1. Возраст",
                desc: "Запросите возраст. Выведите 'Вам [Возраст] лет'.",
                tests: [
                    { input: "18", expected: "Вам 18 лет" },
                    { input: "5", expected: "Вам 5 лет" },
                    { input: "100", expected: "Вам 100 лет" }
                ]
            },
            {
                id: "v3t2",
                title: "Задача 2. Произведение чисел",
                desc: "Запросите два целых числа. Выведите произведение.",
                tests: [
                    { input: "5\n5", expected: "25" },
                    { input: "7\n8", expected: "56" },
                    { input: "0\n10", expected: "0" }
                ]
            },
            {
                id: "v3t3",
                title: "Задача 3. Расчет сдачи",
                desc: "Запросите стоимость и оплату (float). Выведите сдачу.",
                tests: [
                    { input: "50\n100", expected: "50.0" },
                    { input: "10.5\n20.0", expected: "9.5" },
                    { input: "100\n100", expected: "0.0" }
                ]
            },
            {
                id: "v3t4",
                title: "Задача 4. Длина окружности",
                desc: "Запросите радиус (float). Выведите длину окружности (L=2*3.14*r).",
                tests: [
                    { input: "1", expected: "6.28" },
                    { input: "0", expected: "0.0" },
                    { input: "5", expected: "31.400000000000002" } // Учитываем особенности float
                ]
            },
            {
                id: "v3t5",
                isHard: true,
                title: "Задача 5. Температура (Повышенная сложность)",
                desc: "Запросите температуру в градусах Цельсия (float). Переведите её в градусы Фаренгейта по формуле: F = C * 1.8 + 32. Выведите результат.",
                tests: [
                    { input: "0", expected: "32.0" },
                    { input: "10", expected: "50.0" },
                    { input: "-10", expected: "14.0" }
                ]
            }
        ]
    };

    async function initPyodide() {
        const loader = document.getElementById('loader');
        try {
            pyodide = await loadPyodide();
            loader.className = 'ready';
            loader.innerText = "✅ Python готов к работе";
            renderVariant(1); 
        } catch (e) {
            loader.innerText = "❌ Ошибка загрузки Python: " + e.message;
            console.error(e);
        }
    }

    function renderVariant(num) {
        currentVariant = num;
        codeEditors = {}; 
        
        const tabsContainer = document.getElementById('tasks-container');
        const tabsBtns = document.getElementById('tabs-container');
        tabsBtns.innerHTML = '';
        
        [1, 2, 3].forEach(v => {
            const btn = document.createElement('button');
            btn.className = `tab-btn ${v === num ? 'active' : ''}`;
            btn.innerText = `Вариант ${v}`;
            btn.onclick = () => renderVariant(v);
            tabsBtns.appendChild(btn);
        });

        tabsContainer.innerHTML = '';
        const tasks = VARIANTS[num];

        tasks.forEach(task => {
            const isPassed = taskStatus[task.id] === true;
            const card = document.createElement('div');
            card.className = `task-card ${task.isHard ? 'task-hard' : ''}`;
            
            card.innerHTML = `
                <div class="task-passed-indicator" id="indicator-${task.id}">${isPassed ? '✅' : '⬜'}</div>
                <h2>${task.title}</h2>
                <div class="task-desc" oncopy="return false" oncontextmenu="return false">${task.desc}</div>
                <div class="editor-area">
                    <textarea id="code-${task.id}"># Напишите ваш код здесь</textarea>
                </div>
                <button class="btn-run" onclick="runTests('${task.id}')">Запустить тесты</button>
                <div class="results-grid" id="results-${task.id}"></div>
            `;
            tabsContainer.appendChild(card);

            // Инициализация редактора
            // Проверяем, загрузился ли CodeMirror
            const textarea = document.getElementById(`code-${task.id}`);
            
            if (typeof CodeMirror !== 'undefined') {
                const editor = CodeMirror.fromTextArea(textarea, {
                    mode: "python",
                    theme: "monokai",
                    lineNumbers: true,
                    indentUnit: 4,
                    tabSize: 4,
                    indentWithTabs: false,
                    extraKeys: {
                        "Tab": function(cm) {
                            cm.replaceSelection("    ", "end");
                        }
                    }
                });

                editor.on("beforeChange", function(cm, change) {
                    if (change.origin === "paste") {
                        change.cancel();
                    }
                });
                
                codeEditors[task.id] = editor;
            } else {
                // Fallback: если CodeMirror не загрузился, используем обычный textarea
                // Добавляем обработчик запрета вставки для обычного textarea
                textarea.onpaste = function(e) { e.preventDefault(); };
                codeEditors[task.id] = {
                    getValue: () => textarea.value,
                    setValue: (val) => { textarea.value = val; }
                };
            }
        });
    }

    async function runTests(taskId) {
        if (!pyodide) return;
        
        let taskData;
        for (let v in VARIANTS) {
            const found = VARIANTS[v].find(t => t.id === taskId);
            if (found) { taskData = found; break; }
        }

        const userCode = codeEditors[taskId].getValue();
        
        const resultsContainer = document.getElementById(`results-${taskId}`);
        const indicator = document.getElementById(`indicator-${taskId}`);
        
        resultsContainer.innerHTML = ''; 
        indicator.innerHTML = '⏳';
        let allPassed = true;

        for (const test of taskData.tests) {
            try {
                await pyodide.runPythonAsync(`
import sys, builtins
from io import StringIO
_input_data = """${test.input}""".split('\\n')
_input_idx = 0
def custom_input(prompt=""):
    global _input_idx
    if _input_idx >= len(_input_data): return ""
    val = _input_data[_input_idx]
    _input_idx += 1
    return val
builtins.input = custom_input
sys.stdout = StringIO()
                `);
                await pyodide.runPythonAsync(userCode);
                const output = await pyodide.runPythonAsync("sys.stdout.getvalue()");
                
                const cleanOutput = output.trim();
                const cleanExpected = test.expected.trim();
                const isPassed = cleanOutput === cleanExpected;
                if (!isPassed) allPassed = false;

                resultsContainer.innerHTML += `
                    <div class="test-case ${isPassed ? 'success' : 'fail'}">
                        <div class="test-header">
                            <span>Тест: ${test.input.replace(/\n/g, ' ↵ ')}</span>
                            <span class="${isPassed ? 'status-ok' : 'status-fail'}">${isPassed ? '✅ OK' : '❌ Ошибка'}</span>
                        </div>
                        <div><span class="label">Ожидание:</span> ${test.expected}</div>
                        ${!isPassed ? `<div><span class="label">Вывод:</span> <span style="color:var(--error)">${cleanOutput}</span></div>` : ''}
                    </div>
                `;
            } catch (err) {
                allPassed = false;
                resultsContainer.innerHTML += `<div class="test-case fail"><div class="test-header"><span>Ошибка</span><span class="status-fail">❌</span></div>${err.message}</div>`;
                break; 
            }
        }
        
        if (allPassed) {
            resultsContainer.innerHTML = `<div class="test-case success"><strong>🎉 Все тесты пройдены!</strong></div>` + resultsContainer.innerHTML;
            indicator.innerHTML = '✅';
            taskStatus[taskId] = true;
        } else {
            indicator.innerHTML = '❌';
            taskStatus[taskId] = false;
        }
    }

    function finishWork() {
        const nameInput = document.getElementById('student-name');
        const classInput = document.getElementById('student-class');
        const name = nameInput.value.trim() || "Не указан";
        const cls = classInput.value.trim() || "Не указан";

        const tasks = VARIANTS[currentVariant];
        let solvedCount = 0;
        tasks.forEach(task => { if (taskStatus[task.id] === true) solvedCount++; });

        let grade = 2;
        let styleClass = "grade-style-2";
        let emoji = "😞";
        let title = "Попробуйте еще раз";

        if (solvedCount === 5) {
            grade = 5; styleClass = "grade-style-5"; emoji = "🏆"; title = "Превосходно!";
        } else if (solvedCount >= 3) {
            grade = 4; styleClass = "grade-style-4"; emoji = "👍"; title = "Хороший результат!";
        } else if (solvedCount === 2) {
            grade = 3; styleClass = "grade-style-3"; emoji = "🤔"; title = "Удовлетворительно";
        }

        document.getElementById('res-name').innerText = name;
        document.getElementById('res-class').innerText = cls;
        document.getElementById('res-variant').innerText = currentVariant;
        document.getElementById('res-solved').innerText = `${solvedCount} из 5`;
        
        document.getElementById('modal-emoji').innerText = emoji;
        document.getElementById('modal-title').innerText = title;
        const gradeCircle = document.getElementById('modal-grade-circle');
        gradeCircle.innerText = grade;
        gradeCircle.className = `modal-grade-container ${styleClass}`;
        
        document.getElementById('result-modal').classList.add('modal-open');
    }

    function closeModal(event) {
        if (event.target.classList.contains('modal-overlay')) {
            document.getElementById('result-modal').classList.remove('modal-open');
            resetApp();
        }
    }

    function closeModalAndReset() {
        document.getElementById('result-modal').classList.remove('modal-open');
        resetApp();
    }

    function resetApp() {
        taskStatus = {};
        document.getElementById('student-name').value = '';
        document.getElementById('student-class').value = '';
        
        // Сбрасываем редакторы
        for (let id in codeEditors) {
            // Если это CodeMirror
            if (codeEditors[id].setValue) {
                 codeEditors[id].setValue("# Напишите ваш код здесь");
            }
        }
        
        renderVariant(1);
    }

    // Запуск
    initPyodide();
</script>
